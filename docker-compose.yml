name: fastcheckin

services:
  app-perf:
    profiles:
      - perf-small
    build:
      context: .
      dockerfile: docker/Dockerfile.perf
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      perf-db-role:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      MOBILE_JWT_SECRET: ${MOBILE_JWT_SECRET:?Set MOBILE_JWT_SECRET}
      DATABASE_URL: ecto://fastcheck_perf:${FASTCHECK_PERF_DB_PASSWORD:?Set FASTCHECK_PERF_DB_PASSWORD}@pgbouncer:5432/fastcheck_prod
      MIGRATION_DATABASE_URL: ecto://postgres:${PERF_ADMIN_DB_PASSWORD:?Set PERF_ADMIN_DB_PASSWORD}@postgres:5432/fastcheck_prod
      DATABASE_POOLING_MODE: pgbouncer_transaction
      DB_PREPARE_MODE: unnamed
      OBAN_NOTIFIER: pg
      DATABASE_SSL: "false"
      DOMAIN: localhost
      PORT: 4000
      REDIS_URL: redis://redis:6379
      ENABLE_METRICS: "true"
      RUN_MIGRATIONS: "true"
    networks:
      - fastcheck_network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    cpus: 2.0
    mem_limit: 2g

  perf-proxy:
    profiles:
      - perf-small
    build:
      context: .
      dockerfile: docker/perf-proxy.Dockerfile
    restart: unless-stopped
    depends_on:
      app-perf:
        condition: service_healthy
    environment:
      PERF_DEVICE_HEADER: x-perf-device-id
      PERF_DEVICE_IP_PREFIX: "10.250"
      PORT: 4100
      TARGET_BASE_URL: http://app-perf:4000
    ports:
      - "4100:4100"
    networks:
      - fastcheck_network

  postgres:
    profiles:
      - perf-small
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fastcheck_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PERF_ADMIN_DB_PASSWORD:?Set PERF_ADMIN_DB_PASSWORD}
    labels:
      com.fastcheck.perf-pg18-data-migration-ack: "${FASTCHECK_PERF_PG18_DATA_MIGRATION_ACK:?Set FASTCHECK_PERF_PG18_DATA_MIGRATION_ACK only after the existing PG18 data is backed up and deliberately migrated}"
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastcheck_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fastcheck_network

  perf-db-role:
    profiles:
      - perf-small
    image: postgres:18-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ${PERF_ADMIN_DB_PASSWORD:?Set PERF_ADMIN_DB_PASSWORD}
      FASTCHECK_PERF_DB_PASSWORD: ${FASTCHECK_PERF_DB_PASSWORD:?Set FASTCHECK_PERF_DB_PASSWORD}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$PGUSER" -d "$$PGDATABASE"; do
          sleep 1
        done

        if psql -Atqc "SELECT 1 FROM pg_roles WHERE rolname = 'fastcheck_perf'" | grep -q '^1$'; then
          psql -v ON_ERROR_STOP=1 -v perf_password="$$FASTCHECK_PERF_DB_PASSWORD" <<'SQL'
        SELECT format(
          'ALTER ROLE fastcheck_perf LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
          :'perf_password'
        )
        \gexec
        SQL
        else
          psql -v ON_ERROR_STOP=1 -v perf_password="$$FASTCHECK_PERF_DB_PASSWORD" <<'SQL'
        SELECT format(
          'CREATE ROLE fastcheck_perf LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
          :'perf_password'
        )
        \gexec
        SQL
        fi

        psql -v ON_ERROR_STOP=1 -d fastcheck_prod <<'SQL'
        GRANT CONNECT ON DATABASE fastcheck_prod TO fastcheck_perf;
        ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
          GRANT SELECT, INSERT, UPDATE, DELETE, REFERENCES, TRIGGER ON TABLES TO fastcheck_perf;
        ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
          GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO fastcheck_perf;
        SQL

        psql -v ON_ERROR_STOP=1 -d fastcheck_prod <<'SQL'
        GRANT USAGE ON SCHEMA public TO fastcheck_perf;
        GRANT SELECT, INSERT, UPDATE, DELETE, REFERENCES, TRIGGER
          ON ALL TABLES IN SCHEMA public TO fastcheck_perf;
        GRANT USAGE, SELECT, UPDATE
          ON ALL SEQUENCES IN SCHEMA public TO fastcheck_perf;
        SQL
    networks:
      - fastcheck_network

  pgbouncer:
    profiles:
      - perf-small
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: fastcheck_perf
      DB_PASSWORD: ${FASTCHECK_PERF_DB_PASSWORD:?Set FASTCHECK_PERF_DB_PASSWORD}
      DB_NAME: fastcheck_prod
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: fastcheck_perf

      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 3
      SERVER_LIFETIME: 3600
      SERVER_IDLE_TIMEOUT: 600
      LOG_CONNECTIONS: 1
      LOG_DISCONNECTIONS: 1
      LOG_POOLER_ERRORS: 1
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
      perf-db-role:
        condition: service_completed_successfully
    networks:
      - fastcheck_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U fastcheck_perf -d fastcheck_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles:
      - perf-small
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fastcheck_network

networks:
  fastcheck_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
